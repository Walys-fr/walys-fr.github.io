# =========================================================
# Configuration de l'éditeur Pages CMS (https://pagescms.org)
# ⚠️ Une fois sur GitHub, renommez ce fichier « .pages.yml » (avec un point devant).
# Il décrit les formulaires d'édition : vous n'avez pas besoin de le modifier.
# =========================================================

media:
  - name: images
    label: Images
    input: assets/images
    output: /assets/images
    categories: [image]

content:

  # ------------------------------------------------------- RÉGLAGES
  - name: reglages
    label: "⚙️ Réglages généraux"
    type: file
    path: _data/reglages.yml
    format: yaml
    fields:
      - name: email
        label: Adresse e-mail de contact
        type: string
        required: true
        description: Utilisée par tous les boutons « Contact » et « Support » du site.
      - name: whatsapp
        label: Numéro WhatsApp Business
        type: string
        description: "Ex. : 0692 12 34 56 ou +262 692 12 34 56. Laissez vide pour masquer les boutons WhatsApp."
      - name: whatsapp_lien
        label: Lien WhatsApp Business (prioritaire)
        type: string
        description: "Le lien court donné par WhatsApp Business (Réglages › Outils pour les entreprises › Lien court), ex. https://wa.me/message/ABC123. S'il est rempli, tous les boutons WhatsApp l'utilisent à la place du numéro."
      - name: logo
        label: Logo Walys
        type: image
        description: Format PNG conseillé, fond transparent.
        options:
          media: images
          path: assets/images
      - name: signature
        label: Signature en bas de page
        type: string
        description: "Ex. : Wylfried Salcedo, EI"
      - name: baseline
        label: Phrase de présentation (pied de page)
        type: text
      - name: description_site
        label: Description pour Google et les partages
        type: text
        description: Une ou deux phrases. Apparaît dans les résultats de recherche.
      - name: engagements
        label: Mes engagements (affichés sur chaque page de service)
        type: string
        list: true

  # ------------------------------------------------------- ACCUEIL
  - name: accueil
    label: "🏠 Page d'accueil"
    type: file
    path: _data/accueil.yml
    format: yaml
    fields:
      - name: entete
        label: En-tête (haut de page)
        type: object
        fields:
          - { name: badges, label: "Petites étiquettes au-dessus du titre", type: string, list: true }
          - { name: titre, label: "Titre — 1re ligne", type: string }
          - { name: titre_couleur, label: "Titre — partie en couleur", type: string }
          - { name: titre_fin, label: "Titre — fin", type: string }
          - { name: sous_titre, label: "Texte sous le titre", type: text }
          - { name: bouton_principal, label: "Texte du bouton principal", type: string }
          - { name: bouton_secondaire, label: "Texte du second bouton", type: string }
      - name: chiffres
        label: Bandeau de chiffres (sous l'en-tête)
        type: object
        list: { min: 1, max: 4 }
        description: 4 cases conseillées.
        fields:
          - { name: chiffre, label: "Chiffre (en orange, facultatif)", type: string }
          - { name: mot, label: "Mot", type: string }
          - { name: texte, label: "Petit texte", type: string }
      - name: services
        label: Section Services
        type: object
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: texte, label: "Texte d'introduction", type: text }
      - name: apps
        label: Section Apps
        type: object
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: texte, label: "Texte d'introduction", type: text }
      - name: vie_privee
        label: Section Vie privée
        type: object
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: texte, label: "Texte", type: text }
          - name: principes
            label: Principes
            type: object
            list: true
            fields:
              - { name: icone, label: "Pictogramme", type: select, options: { values: &icones [ { name: document, label: "Document" }, { name: personnes, label: "Personnes" }, { name: equipe, label: "Équipe" }, { name: formation, label: "Formation (toque)" }, { name: code, label: "Code / écran" }, { name: ecran, label: "Écran" }, { name: telephone, label: "Téléphone" }, { name: nuage, label: "Nuage iCloud" }, { name: interdit, label: "Interdit" }, { name: telecharger, label: "Télécharger" }, { name: portefeuille, label: "Portefeuille" }, { name: pieces, label: "Pièces" }, { name: euro, label: "Euro" }, { name: mail, label: "E-mail" }, { name: graphique, label: "Graphique" }, { name: widget, label: "Widget" }, { name: globe, label: "Globe / langues" }, { name: calendrier, label: "Calendrier" }, { name: chrono, label: "Chronomètre" }, { name: micro, label: "Micro" }, { name: musique, label: "Musique" }, { name: livre, label: "Livre" }, { name: pdf, label: "PDF" }, { name: coeur, label: "Cœur" }, { name: bouclier, label: "Bouclier" }, { name: cadenas, label: "Cadenas" }, { name: mallette, label: "Mallette" }, { name: stylo, label: "Stylo" }, { name: dossier, label: "Dossier" }, { name: lieu, label: "Lieu" }, { name: camion, label: "Camion" }, { name: aide, label: "Aide (?)" }, { name: etoile, label: "Étoile" }, { name: serveur, label: "Serveur" } ] } }
              - { name: titre, label: "Titre", type: string }
              - { name: texte, label: "Texte", type: text }
          - { name: note_site, label: "Phrase sur le site lui-même", type: string }
      - name: methode
        label: Section Méthode
        type: object
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: texte, label: "Texte", type: text }
          - name: etapes
            label: Étapes
            type: object
            list: true
            fields:
              - { name: titre, label: "Titre de l'étape", type: string }
              - { name: texte, label: "Texte", type: text }
      - name: a_propos
        label: Section À propos
        type: object
        fields:
          - { name: nom, label: "Nom", type: string }
          - { name: introduction, label: "Introduction (texte en grand)", type: text }
          - { name: texte, label: "Texte", type: text }
          - name: parcours
            label: Parcours
            type: object
            list: true
            fields:
              - { name: icone, label: "Pictogramme", type: select, options: { values: *icones } }
              - { name: titre, label: "Titre", type: string }
              - { name: texte, label: "Texte", type: string }
          - { name: citation, label: "Citation (encadré bleu)", type: text }
          - { name: citation_suite, label: "Texte sous la citation", type: text }
          - { name: localisation, label: "Localisation", type: string }
      - name: faq
        label: Questions fréquentes
        type: object
        list: true
        fields:
          - { name: question, label: "Question", type: string }
          - { name: reponse, label: "Réponse", type: text }
      - name: contact
        label: Section Contact
        type: object
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: texte, label: "Texte", type: text }
          - name: sujets
            label: Raccourcis de contact
            type: object
            list: true
            description: Chaque raccourci ouvre un e-mail avec son titre en objet.
            fields:
              - { name: icone, label: "Pictogramme", type: select, options: { values: *icones } }
              - { name: titre, label: "Titre (sert aussi d'objet de l'e-mail)", type: string }
              - { name: sous_titre, label: "Sous-titre", type: string }

  # ------------------------------------------------------- SERVICES
  - name: services
    label: "💼 Services"
    type: collection
    path: _services
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: titre
      fields: [titre, ordre]
      sort: ordre
    fields:
      - { name: titre, label: "Nom du service", type: string, required: true, description: "Ex. : Ressources humaines & paie. Le nom du fichier (et donc l'adresse de la page) est créé à partir de ce nom." }
      - { name: ordre, label: "Ordre d'affichage", type: number, description: "1 = en premier." }
      - { name: icone, label: "Pictogramme", type: select, options: { values: *icones } }
      - { name: resume, label: "Résumé (carte sur l'accueil)", type: text }
      - { name: titre_page, label: "Grand titre de la page — 1re ligne", type: string }
      - { name: titre_page_couleur, label: "Grand titre — 2e ligne (en couleur)", type: string }
      - { name: introduction, label: "Texte d'introduction", type: text }
      - name: offres
        label: Ce que je propose (cartes)
        type: object
        list: true
        fields:
          - { name: icone, label: "Pictogramme", type: select, options: { values: *icones } }
          - { name: titre, label: "Titre", type: string }
          - { name: points, label: "Points", type: string, list: true }
      - { name: pour_qui, label: "Pour qui ?", type: string, list: true }
      - name: etapes
        label: Comment ça se passe (étapes)
        type: object
        list: true
        fields:
          - { name: titre, label: "Titre de l'étape", type: string }
          - { name: texte, label: "Texte", type: text }
      - { name: sujet_email, label: "Objet de l'e-mail de contact", type: string }
      - { name: afficher_apps, label: "Afficher les apps Walys en bas de la page", type: boolean }

  # ------------------------------------------------------- APPS
  - name: apps
    label: "📱 Apps"
    type: collection
    path: _apps
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: nom
      fields: [nom, statut, ordre]
      sort: ordre
    fields:
      # --- Identité
      - { name: nom, label: "Nom de l'app", type: string, required: true, description: "Le nom du fichier (et l'adresse de la page) est créé à partir de ce nom à la création. Il ne change plus ensuite." }
      - { name: ordre, label: "Ordre d'affichage", type: number, description: "1 = en premier." }
      - name: statut
        label: Statut
        type: select
        options:
          values:
            - { name: dev, label: "En développement" }
            - { name: bientot, label: "Bientôt sur l'App Store" }
            - { name: dispo, label: "Disponible" }
      - { name: lien_app_store, label: "Lien App Store", type: string, description: "À remplir quand l'app est publiée (https://apps.apple.com/…). Le bouton « Télécharger » apparaît alors automatiquement." }
      - name: icone
        label: Icône de l'app
        type: image
        description: "Image carrée 1024 × 1024, SANS coins arrondis (le site les arrondit). Dans Xcode : Assets › AppIcon."
        options:
          media: images
          path: assets/images/apps
      - name: teinte
        label: Couleur de secours
        type: select
        description: Utilisée seulement si aucune icône n'est déposée, et pour le halo de la fiche.
        options:
          values:
            - { name: bleu, label: "Bleu Walys" }
            - { name: vert, label: "Vert" }
            - { name: orange, label: "Orange" }
            - { name: violet, label: "Violet" }
            - { name: rouge, label: "Rouge" }
            - { name: gris, label: "Gris" }
      # --- Textes courts
      - { name: accroche, label: "Accroche (une phrase courte)", type: string, description: "Affichée sur les cartes et dans le titre de l'onglet." }
      - { name: slogan, label: "Phrase d'en-tête de la fiche", type: text }
      - { name: resume, label: "Résumé (carte de l'accueil)", type: text }
      - { name: plateformes, label: "Plateformes", type: string, description: "Ex. : iPhone · iPad · Mac" }
      - { name: prix, label: "Modèle de prix", type: string, description: "Ex. : Achat unique, Abonnement, À venir" }
      - { name: points, label: "Points forts (liste sur l'accueil)", type: string, list: true }
      - { name: description, label: "Description pour Google et les partages", type: text }
      # --- Onglet Présentation
      - name: presentation
        label: "Onglet Présentation — introduction"
        type: object
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: texte, label: "Texte", type: text }
      - name: fonctions
        label: "Onglet Présentation — fonctions"
        type: object
        list: true
        fields:
          - { name: icone, label: "Pictogramme", type: select, options: { values: *icones } }
          - { name: titre, label: "Titre", type: string }
          - { name: texte, label: "Texte", type: text }
      - name: captures
        label: Captures d'écran
        type: image
        description: Jusqu'à 8 images, dans l'ordre d'affichage. Les captures App Store conviennent parfaitement.
        options:
          media: images
          path: assets/images/apps
          multiple: { max: 8 }
      - name: format_captures
        label: Format des captures
        type: select
        options:
          values:
            - { name: iphone, label: "iPhone / iPad (vertical)" }
            - { name: mac, label: "Mac (horizontal)" }
      - name: infos
        label: "Onglet Présentation — En bref"
        type: object
        list: { max: 4 }
        fields:
          - { name: libelle, label: "Libellé", type: string, description: "Ex. : Plateforme, Prix, Langues…" }
          - { name: valeur, label: "Valeur", type: string }
      - name: vie_privee
        label: "Onglet Présentation — encadré vie privée"
        type: object
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: texte, label: "Texte", type: text }
      # --- Onglet Support
      - name: support
        label: "Onglet Support — aide au contact"
        type: object
        fields:
          - { name: appareil, label: "Exemple de modèle d'appareil", type: string, description: "Ex. : ex. iPhone 15" }
          - { name: systeme, label: "Où trouver la version du système", type: string, description: "Ex. : Réglages › Général › Informations" }
      - name: faq
        label: "Onglet Support — questions fréquentes"
        type: object
        list: true
        fields:
          - { name: question, label: "Question", type: string }
          - { name: reponse, label: "Réponse", type: text, description: "Une ligne vide = nouveau paragraphe. « 1. » en début de ligne = liste numérotée." }
      # --- Onglet Confidentialité
      - name: confidentialite
        label: "Onglet Confidentialité"
        type: object
        fields:
          - { name: mise_a_jour, label: "Date de mise à jour", type: string, description: "Ex. : 7 octobre 2026" }
          - name: politique
            label: "Politique complète (identique à celle de l'app)"
            type: object
            list: true
            description: "Si vous remplissez cette liste, elle remplace le texte automatique. Copiez-y les mêmes sections que dans l'app. Écrivez [email] pour insérer votre adresse de contact. Une ligne commençant par « - » crée une puce."
            fields:
              - { name: titre, label: "Titre de la section", type: string }
              - { name: texte, label: "Texte", type: text }
          - { name: stockage, label: "Où sont stockées les données", type: text }
          - name: autorisations
            label: Autorisations et fonctions
            type: object
            list: true
            fields:
              - { name: element, label: "Élément (ex. Microphone)", type: string }
              - { name: usage, label: "À quoi il sert", type: text }
          - { name: section_titre, label: "Section supplémentaire — titre (facultatif)", type: string }
          - { name: section_texte, label: "Section supplémentaire — texte", type: text }

  # ------------------------------------------------------- PAGES LÉGALES
  - name: confidentialite
    label: "🔒 Politique de confidentialité"
    type: file
    path: confidentialite.md
    format: yaml-frontmatter
    fields:
      - { name: layout, type: string, hidden: true, default: legal }
      - { name: afficher_apps, type: boolean, hidden: true, default: true }
      - { name: titre, label: "Titre", type: string }
      - { name: mise_a_jour, label: "Date de mise à jour", type: string }
      - { name: resume, label: "Résumé (encadré en haut)", type: text }
      - { name: body, label: "Contenu de la page", type: rich-text }

  - name: mentions
    label: "⚖️ Mentions légales"
    type: file
    path: mentions-legales.md
    format: yaml-frontmatter
    fields:
      - { name: layout, type: string, hidden: true, default: legal }
      - { name: afficher_apps, type: boolean, hidden: true, default: false }
      - { name: titre, label: "Titre", type: string }
      - { name: mise_a_jour, label: "Date de mise à jour (facultatif)", type: string }
      - { name: resume, label: "Résumé (facultatif)", type: text }
      - { name: body, label: "Contenu de la page (SIRET, adresse…)", type: rich-text }
